[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "film-gan-downscaling"
version = "0.1.0"
description = "FiLM-conditioned, resolution-adaptive GAN for S2S precipitation downscaling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "xarray>=2024.1.0",
    "netcdf4>=1.6.5",
    "cfgrib>=0.9.15",
    "eccodes>=1.7.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["models", "utils", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
